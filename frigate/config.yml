mqtt:
  enabled: true
  host: 192.168.100.100 # Ganti jika IP-nya bukan ini
  port: 1883

database:
  path: /config/frigate.db

version: 0.18-0

# --- DETECTOR ---
# VM CPU = QEMU generic (tanpa AVX). 4 detector CPU supaya antrean deteksi lebih cepat.
detectors:
  cpu1:
    type: cpu
    num_threads: 2
  cpu2:
    type: cpu
    num_threads: 2
  cpu3:
    type: cpu
    num_threads: 2
  cpu4:
    type: cpu
    num_threads: 2

# --- PENGATURAN MOTION & DETEKSI ---
motion:
  threshold: 45             # Abaikan kedipan cahaya/angin ringan agar CPU detector hemat
  contour_area: 150         # Abaikan daun jatuh / objek kecil <150px agar tidak memicu AI detector
  improve_contrast: true

detect:
  enabled: true
  fps: 5                    # 5 fps stabil dengan 0 skipped_fps jauh lebih akurat daripada 8 fps yang di-skip
  min_initialized: 4        # Harus terlihat minimal 4 frame (0.8 dtk) sebelum dianggap orang (cegah pintu/daun kilat)
  max_disappeared: 50       # 50 frame @ 5fps = 10 detik tetap pertahankan ID orang kalau tertutup tiang sesaat
  stationary:
    interval: 10            # Cek ulang objek tiap 10 frame (2 detik)
    threshold: 80           # Toleransi jitter bounding box agar benda diam tidak ke-reset
    max_frames:
      objects:
        person: 75          # Hapus otomatis objek diam setelah +75 frame (15 detik) agar kursi/tas/jaket tidak nyangkut jadi person

objects:
  track:
    - person
  filters:
    person:
      min_score: 0.66       # Tolak objek skor rendah (<66% seperti daun/pintu)
      threshold: 0.75       # Hanya konfirmasi person jika median skor >= 75%
      min_area: 8000        # Abaikan objek kecil (<8000 px)

review:
  alerts:
    labels:
      - person
    cutoff_time: 60         # Gabungkan event dalam 60 detik supaya rekaman tidak terpotong-potong pendek
  detections:
    cutoff_time: 60

snapshots:
  enabled: true
  bounding_box: true
  retain:
    default: 14

# --- PENGATURAN RECORD (UNIVERSAL & HEMAT NFS) ---
record:
  enabled: true
  continuous:
    days: 0 # Mencegah perekaman 24/7 penuh untuk menghemat kapasitas NFS
  motion:
    days: 14 # Simpan segmen yang ada gerakan selama 14 hari
  alerts:
    pre_capture: 10         # Rekam 10 detik sebelum orang terdeteksi
    post_capture: 15        # Rekam +15 detik setelah orang hilang
    retain:
      days: 14
      mode: all             # WAJIB 'all' agar segmen +15 detik setelah orang hilang tidak dihapus walau tanpa gerakan
  detections:
    pre_capture: 10
    post_capture: 15
    retain:
      days: 14
      mode: all             # WAJIB 'all' agar segmen pre/post capture selalu tersimpan utuh

cameras:
  a:
    enabled: true
    friendly_name: Senayan Lorong Dapur
    ffmpeg:
      inputs:
        - path: rtsp://admin:qwe12345@172.16.30.118:554
