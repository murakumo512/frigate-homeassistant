            - detect
            - record
            - audio
    detect:
      width: 1280
      height: 720
      enabled: true
      fps: 5
      min_initialized: 4
      max_disappeared: 50
      stationary:
        interval: 10
        threshold: 80
        max_frames:
          objects:
            person: 75
    live:
