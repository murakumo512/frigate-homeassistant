version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - target: 1883
        published: 1883
        mode: ingress
    volumes:
      - /opt/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /opt/mosquitto/data:/mosquitto/data
      - /opt/mosquitto/log:/mosquitto/log
    networks:
      - smarthome-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.shinobi == true
      restart_policy:
        condition: any

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    environment:
      - TZ: "Asia/Jakarta"
    ports:
      - target: 8123
        published: 8123
        mode: ingress
    volumes:
      - /opt/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - smarthome-net
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.shinobi == true
      restart_policy:
        condition: any

networks:
  smarthome-net:
    driver: overlay
    attachable: true
